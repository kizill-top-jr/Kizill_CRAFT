[package]
name = "kizill-net"
version = "0.1.0"
edition = "2021"

[dependencies]
kizill-core = { path = "../kizill-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
